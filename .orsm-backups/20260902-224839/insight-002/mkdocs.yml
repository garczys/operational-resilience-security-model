site_name: ORSM
site_description: Operational Resilience Security Model
site_author: Stefan Garczynski
copyright: ORSM — Operational Resilience Security Model · <a href="mailto:hello@orsmframework.org">hello@orsmframework.org</a>
  · © 2026
theme:
  name: material
  font:
    text: Ubuntu
    code: Ubuntu Mono
  logo: assets/images/orsm-mark.svg
  favicon: assets/images/orsm-mark.svg
  palette:
  - media: '(prefers-color-scheme: light)'
    scheme: default
    primary: custom
    accent: custom
    toggle:
      icon: material/weather-night
      name: Switch to dark mode
  - media: '(prefers-color-scheme: dark)'
    scheme: slate
    primary: custom
    accent: custom
    toggle:
      icon: material/weather-sunny
      name: Switch to light mode
  features:
  - navigation.tabs
  - navigation.tabs.sticky
  - navigation.sections
  - navigation.top
  - navigation.footer
  - content.code.copy
plugins:
- search
- privacy
nav:
- Home: index.md
- Introduction:
  - What is ORSM?: introduction/what-is-orsm.md
  - The Operational Security Paradox: introduction/security-paradox.md
- The Model:
  - Overview: model/index.md
  - Foundational Principles: model/principles.md
  - Assurance Model: model/assurance-model.md
  - Architecture Design Principles: model/design-principles.md
  - Assessment Domains: model/domains.md
- Assessment:
  - Overview: assessment/index.md
  - Assessment Methodology: assessment/methodology.md
  - Evidence Model: assessment/evidence.md
  - Scoring: assessment/scoring.md
  - Maturity Model: assessment/maturity.md
- Patterns:
  - Good Patterns: patterns/good-patterns.md
  - Anti-Patterns: patterns/anti-patterns.md
- Working with Established Approaches:
  - ORSM and Secure by Design: framework/secure-by-design.md
- In Practice:
  - Overview: in-practice/index.md
  - High-Assurance Enterprise: in-practice/high-assurance-enterprise.md
  - Lightweight Automation: in-practice/lightweight-automation.md
  - Restricted Deployment: in-practice/restricted-deployment.md
  - Trust Domain Transfer: in-practice/trust-domain-transfer.md
  - Security Data Archive: in-practice/security-data-archive.md
  - Security Tooling Ecosystem: in-practice/tooling-ecosystem.md
- Framework Integration:
  - Overview: integration/index.md
  - NIST CSF 2.0: integration/nist.md
  - NCSC Secure by Design: integration/ncsc.md
  - ISO 27001: integration/iso27001.md
  - SABSA: integration/sabsa.md
  - Zero Trust: integration/zero-trust.md
- Resources:
  - ORSM Assurance Questions: resources/assurance-questions.md
  - Architecture Decision Record: resources/adr.md
  - Worked Examples: resources/examples.md
- About:
  - About ORSM: about.md
  - Version & Status: legal/version-status.md
  - Copyright & Licence: legal/copyright.md
  - Disclaimer: legal/disclaimer.md
  - Trademark Notice: legal/trademarks.md
- Insights:
  - Overview: insights/index.md
  - Insight 001 — Individually Rational Controls: insights/individually-rational-controls.md
markdown_extensions:
- admonition
- attr_list
- md_in_html
- toc:
    permalink: true
- pymdownx.details
- pymdownx.superfences
- pymdownx.tabbed:
    alternate_style: true
extra_javascript:
- javascripts/orsm-megamenu.js
extra_css:
- stylesheets/extra.css
extra:
  generator: false
