<svg xmlns="http://www.w3.org/2000/svg"
     viewBox="0 0 1200 520">

<rect width="1200" height="520" rx="14" fill="#f6f7f8"/>

<text x="600"
      y="55"
      text-anchor="middle"
      font-family="Arial"
