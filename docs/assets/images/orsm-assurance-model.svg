<svg xmlns="http://www.w3.org/2000/svg"
     viewBox="0 0 1200 700">

<style>
.title {
  font: 700 34px Arial;
  fill: #20252b;
}

.stage {
  fill: white;
  stroke: #c7ccd0;
  stroke-width: 2;
}

.label {
  font: 700 18px Arial;
  fill: #20252b;
}

.arrow {
  stroke: #9f2f35;
  stroke-width: 5;
}
</style>

<rect width="1200" height="700" rx="14" fill="#f6f7f8"/>

<text x="600"
      y="55"
      text-anchor="middle"
      class="title">
  The ORSM Assurance Model
</text>

<text x="600"
      y="95"
      text-anchor="middle"
      font-family="Arial"
      font-size="18"
      fill="#59636c">
  Does this control improve security outcomes without creating disproportionate operational risk?
</text>

<!-- row -->

<g>
<rect x="45" y="200" width="170" height="100" rx="10" class="stage"/>
<text x="130" y="258" text-anchor="middle" class="label">Protection Intent</text>
</g>

<g>
<rect x="245" y="200" width="170" height="100" rx="10" class="stage"/>
<text x="330" y="247" text-anchor="middle" class="label">Security</text>
<text x="330" y="271" text-anchor="middle" class="label">Benefit</text>
</g>

<g>
<rect x="445" y="200" width="170" height="100" rx="10" class="stage"/>
<text x="530" y="247" text-anchor="middle" class="label">Operational</text>
<text x="530" y="271" text-anchor="middle" class="label">Cost</text>
</g>

<g>
<rect x="645" y="200" width="170" height="100" rx="10" class="stage"/>
<text x="730" y="258" text-anchor="middle" class="label">Survivability</text>
</g>

<g>
<rect x="845" y="200" width="170" height="100" rx="10" class="stage"/>
<text x="930" y="258" text-anchor="middle" class="label">Sustainability</text>
</g>

<!-- arrows -->
<line x1="215" y1="250" x2="240" y2="250" class="arrow"/>
<line x1="415" y1="250" x2="440" y2="250" class="arrow"/>
<line x1="615" y1="250" x2="640" y2="250" class="arrow"/>
<line x1="815" y1="250" x2="840" y2="250" class="arrow"/>

<!-- evidence -->

<rect x="380"
      y="385"
      width="440"
      height="90"
      rx="10"
      fill="#20252b"/>

<text x="600"
      y="425"
      text-anchor="middle"
      font-family="Arial"
      font-size="22"
      font-weight="700"
      fill="#ffffff">
  Evidence-Based Architectural Assurance
</text>

<text x="600"
      y="453"
      text-anchor="middle"
      font-family="Arial"
      font-size="15"
      fill="#ffffff">
  Threat · Dependencies · Recovery · Metrics · Incidents
</text>

<line x1="600" y1="300" x2="600" y2="380"
      stroke="#9f2f35" stroke-width="5"/>

<!-- decisions -->

<text x="600"
      y="545"
      text-anchor="middle"
      font-family="Arial"
      font-size="20"
      font-weight="700"
      fill="#20252b">
  Assurance Decision
</text>

<g font-family="Arial" font-size="18" font-weight="700">

<rect x="190" y="580" width="180" height="60" rx="8" fill="#ffffff" stroke="#20252b"/>
<text x="280" y="617" text-anchor="middle" fill="#20252b">RETAIN</text>

<rect x="405" y="580" width="180" height="60" rx="8" fill="#ffffff" stroke="#20252b"/>
<text x="495" y="617" text-anchor="middle" fill="#20252b">IMPROVE</text>

<rect x="620" y="580" width="180" height="60" rx="8" fill="#ffffff" stroke="#20252b"/>
<text x="710" y="617" text-anchor="middle" fill="#20252b">REDESIGN</text>

<rect x="835" y="580" width="180" height="60" rx="8" fill="#9f2f35"/>
<text x="925" y="617" text-anchor="middle" fill="#ffffff">RETIRE</text>

</g>

</svg>
