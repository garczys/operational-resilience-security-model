<svg xmlns="http://www.w3.org/2000/svg"
     width="520"
     height="120"
     viewBox="0 0 520 120">

  <rect width="520" height="120" fill="none"/>

  <!-- Mark -->
  <g transform="translate(10,10)">
    <rect x="0" y="0" width="100" height="100"
          rx="8"
          fill="#20252b"/>

    <!-- resilience layers -->
    <path d="M20 30 H80"
          stroke="#ffffff"
          stroke-width="8"
          stroke-linecap="round"/>

    <path d="M20 50 H65"
          stroke="#ffffff"
          stroke-width="8"
          stroke-linecap="round"/>

    <path d="M20 70 H80"
          stroke="#ffffff"
          stroke-width="8"
          stroke-linecap="round"/>

    <!-- resilience break / recovery -->
    <path d="M68 50 L85 50"
          stroke="#9f2f35"
          stroke-width="8"
          stroke-linecap="round"/>

    <circle cx="86"
            cy="50"
            r="7"
            fill="#9f2f35"/>
  </g>

  <!-- Wordmark -->
  <text x="135"
        y="55"
        font-family="Arial, Helvetica, sans-serif"
        font-size="46"
        font-weight="700"
        fill="#20252b">
    ORSM
  </text>

  <text x="137"
        y="83"
        font-family="Arial, Helvetica, sans-serif"
        font-size="16"
        font-weight="500"
        letter-spacing="1"
        fill="#59636c">
    OPERATIONAL RESILIENCE SECURITY MODEL
  </text>

  <rect x="135"
        y="94"
        width="330"
        height="4"
        fill="#9f2f35"/>
</svg>
