<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 500">

<style>
.title {
  font: 700 34px Arial;
  fill: #20252b;
}
.subtitle {
  font: 18px Arial;
  fill: #59636c;
}
.day {
  font: 700 18px Arial;
  fill: #9f2f35;
}
.stage {
  font: 700 18px Arial;
  fill: #20252b;
}
.detail {
  font: 15px Arial;
  fill: #59636c;
}
.line {
  stroke: #c7ccd0;
  stroke-width: 4;
}
.marker {
  fill: #ffffff;
  stroke: #9f2f35;
  stroke-width: 5;
}
.closing {
  font: 700 22px Arial;
  fill: #20252b;
}
</style>

<rect width="1200" height="500" rx="14" fill="#f6f7f8"/>

<text x="600" y="55" text-anchor="middle" class="title">
  The 90-Day Island Test
</text>

<text x="600" y="92" text-anchor="middle" class="subtitle">
  What happens after enterprise IT becomes unavailable or untrusted?
</text>

<!-- timeline -->
<line x1="120" y1="225" x2="1080" y2="225" class="line"/>

<!-- Day 1 -->
<circle cx="120" cy="225" r="17" class="marker"/>
<text x="120" y="165" text-anchor="middle" class="day">DAY 1</text>
<text x="120" y="195" text-anchor="middle" class="stage">Isolation</text>
<text x="120" y="275" text-anchor="middle" class="detail">Did isolation work?</text>

<!-- Day 7 -->
<circle cx="360" cy="225" r="17" class="marker"/>
<text x="360" y="165" text-anchor="middle" class="day">DAY 7</text>
<text x="360" y="195" text-anchor="middle" class="stage">Dependency</text>
<text x="360" y="275" text-anchor="middle" class="detail">What begins to fail?</text>

<!-- Day 30 -->
<circle cx="600" cy="225" r="17" class="marker"/>
<text x="600" y="165" text-anchor="middle" class="day">DAY 30</text>
<text x="600" y="195" text-anchor="middle" class="stage">Degradation</text>
<text x="600" y="275" text-anchor="middle" class="detail">What capability is lost?</text>

<!-- Day 60 -->
<circle cx="840" cy="225" r="17" class="marker"/>
<text x="840" y="165" text-anchor="middle" class="day">DAY 60</text>
<text x="840" y="195" text-anchor="middle" class="stage">Sustainability</text>
<text x="840" y="275" text-anchor="middle" class="detail">Can people sustain it?</text>

<!-- Day 90 -->
<circle cx="1080" cy="225" r="17" class="marker"/>
<text x="1080" y="165" text-anchor="middle" class="day">DAY 90</text>
<text x="1080" y="195" text-anchor="middle" class="stage">Consequence</text>
<text x="1080" y="275" text-anchor="middle" class="detail">Can the mission continue?</text>

<!-- degradation sequence -->
<text x="600" y="350" text-anchor="middle" class="subtitle">
  Isolation → Dependency → Degradation → Sustainability → Consequence
</text>

<line x1="310" y1="380" x2="890" y2="380"
      stroke="#9f2f35" stroke-width="3"/>

<text x="600" y="430" text-anchor="middle" class="closing">
  Resilience is not binary. It decays.
</text>

</svg>
